<div class="card">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; flex-wrap: wrap; gap: 16px;">
        <h1 style="color: var(--forest); margin: 0;">Registros y Solicitudes</h1>
    </div>

    <!-- Sección superior: Filtros y visualización -->
    <div style="background: #f8fafc; padding: 20px; border-radius: 16px; border: 1px solid #e2e8f0; margin-bottom: 32px;">
        <div style="display: flex; gap: 16px; align-items: flex-end; flex-wrap: wrap;">
            <div style="flex: 1; min-width: 200px;">
                <label for="registros-filtro-estado" style="font-weight: 600; color: #475569;">Filtrar por Estado</label>
                <select id="registros-filtro-estado" style="width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #cbd5e1;">
                    <option value="">Todas las solicitudes</option>
                    <option value="pendientes">Pendientes</option>
                    <option value="aprobadas">Aprobadas</option>
                    <option value="rechazadas">Rechazadas</option>
                </select>
            </div>
            <button id="btn-recargar-solicitudes" class="btn" style="background: var(--gold); color: white; padding: 12px 24px; height: 45px;">
                ↻ Actualizar Tabla
            </button>
        </div>
    </div>

    <!-- Tabla principal de solicitudes -->
    <h2 style="color: var(--forest); margin-bottom: 15px; font-size: 1.3rem;">Historial de Solicitudes</h2>
    <div style="overflow-x: auto; background: white; border-radius: 16px; border: 1px solid #e2e8f0; margin-bottom: 40px;">
        <table style="width: 100%; border-collapse: collapse;">
            <thead style="background: #f1f5f9; text-align: left;">
                <tr>
                    <th style="padding: 16px; border-bottom: 2px solid #cbd5e1; color: #1e293b;">Folio</th>
                    <th style="padding: 16px; border-bottom: 2px solid #cbd5e1; color: #1e293b;">ID Empleado</th>
                    <th style="padding: 16px; border-bottom: 2px solid #cbd5e1; color: #1e293b;">Fecha Salida</th>
                    <th style="padding: 16px; border-bottom: 2px solid #cbd5e1; color: #1e293b;">Horas</th>
                    <th style="padding: 16px; border-bottom: 2px solid #cbd5e1; color: #1e293b;">Jefe Directo</th>
                    <th style="padding: 16px; border-bottom: 2px solid #cbd5e1; color: #1e293b;">Jefe Superior</th>
                    <th style="padding: 16px; border-bottom: 2px solid #cbd5e1; color: #1e293b;">Estado Final</th>
                    <th style="padding: 16px; border-bottom: 2px solid #cbd5e1; color: #1e293b;">Acciones</th>
                </tr>
            </thead>
            <tbody id="registros-solicitudes-body">
                <tr>
                    <td colspan="8" style="text-align:center; padding:20px; color:#64748b;">Cargando historial...</td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- Sección exclusiva para Administradores/Jefes (Registro Manual) -->
    <!-- El CSS y JS se encargarán de ocultar esto si el usuario es solo Empleado -->
    <div id="seccion-registro-manual" style="border-top: 2px dashed #e2e8f0; padding-top: 32px;">
        <h2 style="color: var(--forest); margin-bottom: 15px; font-size: 1.3rem;">Registro Manual de Afectaciones (Admin/Jefes)</h2>
        <form id="registroForm" style="display: grid; grid-template-columns: 1fr 1fr; gap: 24px;">
            
            <!-- Columna Izquierda: Datos -->
            <div style="display: flex; flex-direction: column; gap: 16px;">
                <div>
                    <label for="reg-empleado" style="font-weight: 600;">Empleado</label>
                    <select id="reg-empleado" required style="padding: 12px; border-radius: 10px; border: 1px solid #cbd5e1;">
                        <option value="" disabled selected>Selecciona un empleado...</option>
                        <!-- Se llena con JS -->
                    </select>
                    <div id="horas-actuales" style="margin-top: 8px; font-size: 0.9rem; color: var(--forest); font-weight: bold;">
                        Horas extra disponibles: 0.00 hrs
                    </div>
                </div>

                <div>
                    <label for="reg-horas" style="font-weight: 600;">Horas a descontar</label>
                    <input type="number" id="reg-horas" step="0.5" min="0.5" placeholder="Ej. 2.5" required style="padding: 12px; border-radius: 10px; border: 1px solid #cbd5e1;">
                </div>

                <div>
                    <label for="reg-motivo" style="font-weight: 600;">Motivo / Observaciones</label>
                    <textarea id="reg-motivo" rows="3" placeholder="Describe el motivo de la salida o el descuento de horas..." required style="padding: 12px; border-radius: 10px; border: 1px solid #cbd5e1;"></textarea>
                </div>
            </div>

            <!-- Columna Derecha: Calendario -->
            <div style="background: #f8fafc; padding: 20px; border-radius: 16px; border: 1px solid #e2e8f0;">
                <label style="font-weight: 600; margin-bottom: 12px; display: block;">Selecciona los días afectados</label>
                <div id="reg-calendar-container">
                    <!-- El calendario dinámico de app.js se inyecta aquí -->
                </div>
                <div id="reg-fechas-seleccionadas" style="margin-top: 16px; font-size: 0.9rem; color: var(--purple); font-weight: 600;">
                    No hay fechas seleccionadas.
                </div>
            </div>

            <div style="grid-column: 1 / -1; display: flex; justify-content: flex-end; margin-top: 16px;">
                <button type="submit" class="btn" style="background: var(--purple); color: white; padding: 14px 32px; font-size: 1.1rem;">
                    Guardar Registro Manual
                </button>
            </div>
        </form>
    </div>
</div>

<script>
    // Pequeño script local para asegurar que la sección de registro manual 
    // se oculte si el usuario es un empleado normal.
    setTimeout(() => {
        const usuarioActual = JSON.parse(sessionStorage.getItem('auth_user') || localStorage.getItem('auth_user') || '{}');
        const rol = String(usuarioActual.rol || '').toLowerCase();
        
        if (rol === 'empleado') {
            const seccionManual = document.getElementById('seccion-registro-manual');
            if (seccionManual) seccionManual.style.display = 'none';
        }
    }, 100);
</script>
