<div class="card">
    <!-- Encabezado de Notificaciones -->
    <div style="margin-bottom: 2rem;">
        <h1 style="margin-top: 0; margin-bottom: 0.5rem; color: #340C51; font-size: 1.8rem; font-weight: 700;">Notificaciones de salida</h1>
        <p style="margin: 0; color: #475569; font-size: 0.95rem;">Aquí se muestran las solicitudes de salida pendientes para autorizar o rechazar.</p>
    </div>

    <!-- Filtro y Botón de Recargar -->
    <div style="display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom: 1.5rem; flex-wrap: wrap;">
        <h2 style="margin:0; color:#1f2d19; font-size:1.2rem;">Bandeja de solicitudes</h2>
        <div style="display:flex; gap:8px; align-items:center;">
            <select id="notificaciones-filtro-estado" style="width:auto; min-width: 150px; padding: 8px 12px; border-radius: 8px; border: 1px solid #cbd5e1;">
                <option value="">Todos los estados</option>
                <option value="pendiente" selected>Pendientes</option>
                <option value="aprobado">Aprobadas</option>
                <option value="rechazado">Rechazadas</option>
            </select>
            <button type="button" id="btn-recargar-notificaciones" class="btn" onclick="cargarSolicitudesNotificaciones()" style="background:#2f582f; color:#fff; padding: 8px 16px; border-radius: 8px; cursor: pointer;">Recargar</button>
        </div>
    </div>

    <!-- Tabla de Notificaciones -->
    <div style="overflow-x:auto;">
        <table style="width: 100%; border-collapse: collapse;">
            <thead>
                <tr style="background-color: #f8fafc; border-bottom: 2px solid #e2e8f0;">
                    <th style="padding: 12px; text-align: left;">ID</th>
                    <th style="padding: 12px; text-align: left;">Empleado</th>
                    <th style="padding: 12px; text-align: left;">Fecha</th>
                    <th style="padding: 12px; text-align: left;">Horas</th>
                    <th style="padding: 12px; text-align: left;">Estado JD</th>
                    <th style="padding: 12px; text-align: left;">Estado JS</th>
                    <th style="padding: 12px; text-align: left;">Final</th>
                    <th style="padding: 12px; text-align: left;">Acciones</th>
                </tr>
            </thead>
            <tbody id="notificaciones-solicitudes-body">
                <tr>
                    <td colspan="8" style="text-align:center; padding: 14px;">Cargando solicitudes...</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
