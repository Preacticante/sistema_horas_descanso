<div class="magic-bento-card">
    <h3>Mi Perfil</h3>
    
    <form id="form-perfil">
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 2rem; margin-bottom: 1.5rem;">
            <div style="display: flex; flex-direction: column;">
                <label style="font-size: 0.9rem; font-weight: 700; color: rgba(255, 255, 255, 0.9); margin-bottom: 0.75rem; text-transform: uppercase; letter-spacing: 0.5px;">Nombre Completo</label>
                <input type="text" id="input-nombre" placeholder="Nombre completo" style="background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 10px; padding: 12px 14px; color: #ffffff; font-family: inherit; font-size: 0.9rem;">
            </div>
            <div style="display: flex; flex-direction: column;">
                <label style="font-size: 0.9rem; font-weight: 700; color: rgba(255, 255, 255, 0.9); margin-bottom: 0.75rem; text-transform: uppercase; letter-spacing: 0.5px;">Correo Electrónico</label>
                <input type="email" id="input-correo" placeholder="correo@uco.edu.mx" style="background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 10px; padding: 12px 14px; color: #ffffff; font-family: inherit; font-size: 0.9rem;">
            </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 2rem; margin-bottom: 2rem;">
            <div style="display: flex; flex-direction: column;">
                <label style="font-size: 0.9rem; font-weight: 700; color: rgba(255, 255, 255, 0.9); margin-bottom: 0.75rem; text-transform: uppercase; letter-spacing: 0.5px;">Número de Empleado</label>
                <input type="text" value="EMP-2026-882" readonly style="background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 10px; padding: 12px 14px; color: rgba(255, 255, 255, 0.6); font-family: inherit; font-size: 0.9rem;">
            </div>
            <div style="display: flex; flex-direction: column;">
                <label style="font-size: 0.9rem; font-weight: 700; color: rgba(255, 255, 255, 0.9); margin-bottom: 0.75rem; text-transform: uppercase; letter-spacing: 0.5px;">Departamento</label>
                <input type="text" value="Docencia / Prepa" readonly style="background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 10px; padding: 12px 14px; color: rgba(255, 255, 255, 0.6); font-family: inherit; font-size: 0.9rem;">
            </div>
        </div>

        <div style="border-top: 1px solid rgba(255, 255, 255, 0.1); padding-top: 2rem; margin-bottom: 1.5rem;">
            <h4 style="margin: 0 0 1.5rem 0; color: rgba(255, 255, 255, 0.9); font-size: 0.95rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px;">Cambiar Contraseña</h4>
            
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 2rem;">
                <div style="display: flex; flex-direction: column;">
                    <label style="font-size: 0.9rem; font-weight: 700; color: rgba(255, 255, 255, 0.9); margin-bottom: 0.75rem; text-transform: uppercase; letter-spacing: 0.5px;">Nueva Contraseña</label>
                    <input type="password" id="input-pass" placeholder="••••••••" style="background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 10px; padding: 12px 14px; color: #ffffff; font-family: inherit; font-size: 0.9rem;">
                </div>
                <div style="display: flex; flex-direction: column;">
                    <label style="font-size: 0.9rem; font-weight: 700; color: rgba(255, 255, 255, 0.9); margin-bottom: 0.75rem; text-transform: uppercase; letter-spacing: 0.5px;">Confirmar Contraseña</label>
                    <input type="password" id="input-pass-confirm" placeholder="••••••••" style="background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 10px; padding: 12px 14px; color: #ffffff; font-family: inherit; font-size: 0.9rem;">
                </div>
            </div>
        </div>

        <div style="display: flex; gap: 1rem; margin-top: 2rem;">
            <button type="button" style="flex: 1; padding: 12px 20px; border-radius: 10px; font-weight: 700; cursor: pointer; background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.3); color: #ffffff; font-size: 0.9rem;" onclick="navigateUsuario('inicio', null)">
                Cancelar
            </button>
            <button type="submit" style="flex: 2; padding: 12px 20px; border-radius: 10px; font-weight: 700; cursor: pointer; background: #4ade80; border: none; color: #000000; font-size: 0.9rem;">
                Guardar Cambios
            </button>
        </div>
    </form>
</div>

<script>
    (function() {
        const rawUser = localStorage.getItem('usuario') || localStorage.getItem('user');
        let userObj = {};
        try { userObj = rawUser ? JSON.parse(rawUser) : {}; } catch(e) {}

        const nombreReal = userObj.nombre_completo || userObj.nombre || "Empleado";
        const correoReal = userObj.email || userObj.correo || "empleado@uco.edu.mx";

        const inputNombre = document.getElementById("input-nombre");
        const inputCorreo = document.getElementById("input-correo");

        if (inputNombre) inputNombre.value = nombreReal;
        if (inputCorreo) inputCorreo.value = correoReal;

        const formPerfil = document.getElementById('form-perfil');
        if (formPerfil) {
            formPerfil.addEventListener('submit', function(e) {
                e.preventDefault();
                
                const nombre = inputNombre ? inputNombre.value : '';
                const pass = document.getElementById('input-pass') ? document.getElementById('input-pass').value : '';
                const passConfirm = document.getElementById('input-pass-confirm') ? document.getElementById('input-pass-confirm').value : '';

                if (pass && pass !== passConfirm) {
                    alert('Las contraseñas no coinciden.');
                    return;
                }

                userObj.nombre_completo = nombre;
                localStorage.setItem('usuario', JSON.stringify(userObj));
                alert('Perfil actualizado correctamente.');
            });
        }
    })();
</script>
