<!-- 📌 CONTENIDO DE registrosU.html (Limpio para inyección dinámica) -->
<div style="max-width: 1100px; margin: 0 auto;">

    <div class="card" style="background: white; padding: 2rem; border-radius: 18px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.03); border-left: 5px solid var(--forest, #124416);">

        <!-- Banner de Saldo Disponible -->
        <div style="background: #f4f8f4; border: 1px solid #d2e3d2; padding: 1rem 1.25rem; border-radius: 8px; margin-bottom: 2rem; display: flex; align-items: center; justify-content: space-between;">
            <span style="color: var(--forest, #124416); font-weight: 600; font-size: 0.95rem;">Tu saldo disponible actual:</span>
            <span style="font-size: 1.2rem; font-weight: 800; color: #1f2d19;"><span id="reg-saldo-disp">16.0</span> hrs</span>
        </div>

        <!-- FORMULARIO GRID: CALENDARIO Y DETALLES -->
        <form id="form-solicitud" onsubmit="procesarSolicitud(event)" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 2rem;">
            
            <!-- COLUMNA IZQUIERDA: CALENDARIO -->
            <div>
                <label style="display: block; font-weight: 700; color: #1f2d19; margin-bottom: 0.5rem; font-size: 0.9rem;">
                    1. Selecciona la fecha en el calendario:
                </label>
                
                <div style="border: 1px solid #cbd5e1; border-radius: 10px; padding: 1rem; background: #fafafa;">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
                        <button type="button" onclick="cambiarMes(-1)" style="background: none; border: 1px solid #cbd5e1; border-radius: 6px; cursor: pointer; padding: 4px 10px; font-weight: bold; color: #475569;">&lt;</button>
                        <span id="cal-mes-ano" style="font-weight: 700; color: var(--forest, #124416); font-size: 1rem;">Cargando...</span>
                        <button type="button" onclick="cambiarMes(1)" style="background: none; border: 1px solid #cbd5e1; border-radius: 6px; cursor: pointer; padding: 4px 10px; font-weight: bold; color: #475569;">&gt;</button>
                    </div>

                    <div style="display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; font-weight: 700; font-size: 0.75rem; color: #64748b; margin-bottom: 0.5rem;">
                        <div>Dom</div><div>Lun</div><div>Mar</div><div>Mié</div><div>Jue</div><div>Vie</div><div>Sáb</div>
                    </div>

                    <div id="cal-dias-grid" style="display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center;">
                        <!-- Se genera con JavaScript -->
                    </div>
                </div>

                <div style="margin-top: 1rem;">
                    <span style="font-size: 0.85rem; color: #64748b;">Fecha seleccionada:</span>
                    <input type="text" id="fecha-seleccionada" required readonly placeholder="Haz clic en un día del calendario" style="width: 100%; margin-top: 0.25rem; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; background: #ffffff; font-weight: 600; color: #1f2d19; box-sizing: border-box;">
                </div>
            </div>

            <!-- COLUMNA DERECHA: HORAS Y MOTIVO -->
            <div style="display: flex; flex-direction: column; gap: 1.25rem;">
                
                <div>
                    <label style="display: block; font-weight: 700; color: #1f2d19; margin-bottom: 0.5rem; font-size: 0.9rem;">
                        2. Horas a tomar para este día:
                    </label>
                    
                    <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.5rem; margin-bottom: 0.75rem;">
                        <button type="button" onclick="setHoras(2)" class="btn-hora-preset" style="padding: 8px; border: 1px solid #cbd5e1; background: white; border-radius: 6px; cursor: pointer; font-weight: 600; color: #334155;">2 hrs</button>
                        <button type="button" onclick="setHoras(4)" class="btn-hora-preset" style="padding: 8px; border: 1px solid #cbd5e1; background: white; border-radius: 6px; cursor: pointer; font-weight: 600; color: #334155;">4 hrs</button>
                        <button type="button" onclick="setHoras(8)" class="btn-hora-preset" style="padding: 8px; border: 1px solid #cbd5e1; background: white; border-radius: 6px; cursor: pointer; font-weight: 600; color: #334155;">8 hrs</button>
                    </div>

                    <input type="number" id="input-horas" min="0.5" max="8" step="0.5" required placeholder="O ingresa un número de horas (Ej. 3.5)" style="width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 0.95rem; box-sizing: border-box;">
                </div>

                <div>
                    <label style="display: block; font-weight: 700; color: #1f2d19; margin-bottom: 0.5rem; font-size: 0.9rem;">
                        3. Motivo de la solicitud:
                    </label>
                    <textarea id="input-motivo" rows="4" required placeholder="Describe brevemente el motivo..." style="width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 0.9rem; font-family: inherit; resize: vertical; box-sizing: border-box;"></textarea>
                </div>

                <div style="display: flex; gap: 1rem; margin-top: auto; padding-top: 1rem;">
                    <button type="button" onclick="if(typeof loadPageUsuario === 'function') loadPageUsuario('inicio');" style="flex: 1; padding: 12px; border: 1px solid #cbd5e1; background: #f8fafc; color: #475569; border-radius: 8px; font-weight: 600; cursor: pointer;">
                        Cancelar
                    </button>
                    <button type="submit" style="flex: 2; padding: 12px; border: none; background: linear-gradient(135deg, var(--gold, #aa7f1f) 0%, #8b6a2a 100%); color: white; border-radius: 8px; font-weight: 700; cursor: pointer; box-shadow: 0 4px 10px rgba(170, 127, 31, 0.25);">
                        Guardar Solicitud
                    </button>
                </div>

            </div>

        </form>

    </div>

</div>

<!-- ⚡ LÓGICA DEL CALENDARIO Y FORMULARIO ENCAPSULADA -->
<script>
    (function() {
        let fechaActual = new Date();
        let diaSeleccionado = null;
        const meses = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];

        window.renderizarCalendario = function() {
            const ano = fechaActual.getFullYear();
            const mes = fechaActual.getMonth();

            const elemMesAno = document.getElementById("cal-mes-ano");
            if (elemMesAno) elemMesAno.textContent = `${meses[mes]} ${ano}`;

            const primerDiaIndex = new Date(ano, mes, 1).getDay();
            const ultimoDia = new Date(ano, mes + 1, 0).getDate();

            const grid = document.getElementById("cal-dias-grid");
            if (!grid) return;
            grid.innerHTML = "";

            for (let i = 0; i < primerDiaIndex; i++) {
                const divVacio = document.createElement("div");
                grid.appendChild(divVacio);
            }

            for (let dia = 1; dia <= ultimoDia; dia++) {
                const btnDia = document.createElement("button");
                btnDia.type = "button";
                btnDia.textContent = dia;
                btnDia.style.cssText = "padding: 8px 0; border: 1px solid #e2e8f0; background: white; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 0.85rem; color: #334155; transition: all 0.2s;";

                const fechaFormateada = `${ano}-${String(mes + 1).padStart(2, '0')}-${String(dia).padStart(2, '0')}`;

                if (diaSeleccionado === fechaFormateada) {
                    btnDia.style.background = "var(--forest, #124416)";
                    btnDia.style.color = "white";
                    btnDia.style.borderColor = "var(--forest, #124416)";
                }

                btnDia.onclick = function() {
                    diaSeleccionado = fechaFormateada;
                    const inputFecha = document.getElementById("fecha-seleccionada");
                    if (inputFecha) inputFecha.value = fechaFormateada;
                    renderizarCalendario();
                };

                grid.appendChild(btnDia);
            }
        };

        window.cambiarMes = function(delta) {
            fechaActual.setMonth(fechaActual.getMonth() + delta);
            renderizarCalendario();
        };

        window.setHoras = function(num) {
            const inputHoras = document.getElementById("input-horas");
            if (inputHoras) inputHoras.value = num;
        };

        window.procesarSolicitud = function(e) {
            e.preventDefault();
            const fecha = document.getElementById("fecha-seleccionada")?.value;
            const horas = document.getElementById("input-horas")?.value;
            const motivo = document.getElementById("input-motivo")?.value;

            if (!fecha) {
                alert("Por favor, haz clic en un día del calendario.");
                return;
            }

            alert(`¡Solicitud registrada con éxito!\n\nFecha: ${fecha}\nHoras: ${horas} hrs\nMotivo: ${motivo}`);
            
            if (typeof loadPageUsuario === 'function') {
                loadPageUsuario('inicio');
            }
        };

        // Renderizar calendario de inmediato al inyectar el HTML
        renderizarCalendario();
    })();
</script>
