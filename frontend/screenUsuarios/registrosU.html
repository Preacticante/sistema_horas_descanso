<div class="magic-bento-card">
    <h3>Solicitud de Reposición de Horas</h3>
    
    <div style="background: rgba(74, 222, 128, 0.15); border: 1px solid rgba(74, 222, 128, 0.3); border-radius: 12px; padding: 1.25rem; margin-bottom: 1.5rem; display: flex; justify-content: space-between; align-items: center;">
        <span style="font-size: 0.95rem; font-weight: 600; color: rgba(255, 255, 255, 0.85);">Saldo disponible para reponer:</span>
        <span style="font-size: 1.4rem; font-weight: 800; color: #4ade80;"><span id="reg-saldo-disp">16.0</span> hrs</span>
    </div>

    <form id="form-solicitud" onsubmit="procesarSolicitud(event)">
        
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 2rem; margin-bottom: 1.5rem;">
            <div style="display: flex; flex-direction: column;">
                <label style="font-size: 0.9rem; font-weight: 700; color: rgba(255, 255, 255, 0.9); margin-bottom: 0.75rem; text-transform: uppercase; letter-spacing: 0.5px;">Fecha del Evento</label>
                <input type="date" id="fecha-seleccionada" required style="background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 10px; padding: 12px 14px; color: #ffffff; font-family: inherit; font-size: 0.9rem;">
            </div>
            <div style="display: flex; flex-direction: column;">
                <label style="font-size: 0.9rem; font-weight: 700; color: rgba(255, 255, 255, 0.9); margin-bottom: 0.75rem; text-transform: uppercase; letter-spacing: 0.5px;">Horas a Reponer</label>
                <input type="number" id="input-horas" min="0.5" max="8" step="0.5" required placeholder="Ej. 4.0" style="background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 10px; padding: 12px 14px; color: #ffffff; font-family: inherit; font-size: 0.9rem;">
            </div>
        </div>

        <div style="display: flex; flex-direction: column; margin-bottom: 1.5rem;">
            <label style="font-size: 0.9rem; font-weight: 700; color: rgba(255, 255, 255, 0.9); margin-bottom: 0.75rem; text-transform: uppercase; letter-spacing: 0.5px;">Motivo de la Solicitud</label>
            <textarea id="input-motivo" rows="5" required placeholder="Describe brevemente el motivo de la solicitud..." style="background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 10px; padding: 12px 14px; color: #ffffff; font-family: inherit; font-size: 0.9rem;"></textarea>
        </div>

        <div style="display: flex; gap: 1rem; margin-top: 2rem;">
            <button type="button" style="flex: 1; padding: 12px 20px; border-radius: 10px; font-weight: 700; cursor: pointer; background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.3); color: #ffffff; font-size: 0.9rem;" onclick="navigateUsuario('inicio', null)">
                Cancelar
            </button>
            <button type="submit" style="flex: 2; padding: 12px 20px; border-radius: 10px; font-weight: 700; cursor: pointer; background: #4ade80; border: none; color: #000000; font-size: 0.9rem; transition: all 0.2s;">
                Enviar Solicitud
            </button>
        </div>

    </form>
</div>

<script>
    window.procesarSolicitud = function(e) {
        e.preventDefault();
        const fecha = document.getElementById("fecha-seleccionada")?.value;
        const horas = document.getElementById("input-horas")?.value;
        const motivo = document.getElementById("input-motivo")?.value;

        if (!fecha || !horas || !motivo) {
            alert("Por favor completa todos los campos");
            return;
        }

        alert(`¡Solicitud registrada con éxito!\n\nFecha: ${fecha}\nHoras: ${horas} hrs\nMotivo: ${motivo}`);
        
        if (typeof navigateUsuario === 'function') {
            navigateUsuario('inicio', null);
        }
    };
</script>
