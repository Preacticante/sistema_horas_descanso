<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso - UCO</title>
    <!-- Three.js para la animación de la seda -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <style>
        /* --- VARIABLES --- */
        :root { 
            --forest-dark: #081d17;
            --purple: #340C51; 
            --purple-hover: #481370;
            --gold: #AA7F31; 
            --gold-hover: #c4953c;
            --muted: rgba(255, 255, 255, 0.65); 
        }
        
        * { 
            box-sizing: border-box; 
            margin: 0;
            padding: 0;
        }
        
        body { 
            margin: 0; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; 
            background-color: var(--forest-dark);
            overflow: hidden;
            position: relative;
        }

        /* --- CANVAS SILK --- */
        #silk-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
        }

        /* --- TARJETA PRINCIPAL --- */
        .login-card { 
            position: relative;
            z-index: 10;
            background: rgba(12, 35, 23, 0.68); 
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 2.2rem 2rem; 
            border-radius: 18px; 
            width: 90%; 
            max-width: 420px; 
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-top: 5px solid var(--gold); 
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6); 
            text-align: left; 
        }

        /* --- MARCA Y TITULOS --- */
        .brand { 
            display: flex; 
            flex-direction: column; 
            gap: 8px; 
            align-items: center; 
            margin-bottom: 1.5rem; 
        }
        
        .brand img { 
            width: 110px; 
            height: 110px; 
            object-fit: contain; 
            filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.4));
        }
        
        h1 { 
            margin: 0 0 6px 0; 
            font-size: 1.45rem; 
            text-align: center; 
            color: #ffffff;
            font-weight: 700;
        }

        /* --- CAMPOS DE ENTRADA --- */
        .form-row { 
            margin-bottom: 16px; 
        }

        label { 
            display: block; 
            font-size: 0.85rem; 
            color: rgba(255, 255, 255, 0.9); 
            margin-bottom: 6px; 
            font-weight: 500;
        }

        input[type="text"], 
        input[type="email"], 
        input[type="password"] { 
            width: 100%; 
            padding: 12px 14px; 
            border-radius: 10px; 
            border: 1px solid rgba(255, 255, 255, 0.18); 
            background: rgba(0, 0, 0, 0.25); 
            color: #ffffff; 
            font-size: 0.95rem; 
            outline: none;
            transition: all 0.25s ease;
        }

        input[type="text"]:focus, 
        input[type="email"]:focus, 
        input[type="password"]:focus {
            border-color: var(--gold);
            background: rgba(0, 0, 0, 0.45);
            box-shadow: 0 0 0 3px rgba(170, 127, 49, 0.25);
        }

        input::placeholder {
            color: rgba(255, 255, 255, 0.38);
        }

        .pw-row { 
            position: relative;
            display: flex; 
            align-items: center; 
        }

        .pw-toggle { 
            position: absolute;
            right: 12px;
            background: transparent; 
            border: none; 
            cursor: pointer; 
            color: var(--muted); 
            font-size: 1.1rem;
        }

        /* --- BOTONES REDISEÑADOS --- */
        .btn { 
            width: 100%; 
            background: linear-gradient(135deg, #d4af37 0%, #aa7f31 100%); 
            color: #0b2219; 
            padding: 13px 16px; 
            border: none; 
            border-radius: 10px; 
            font-weight: 700; 
            font-size: 0.95rem;
            cursor: pointer; 
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(170, 127, 49, 0.35);
        }

        .btn:hover {
            background: linear-gradient(135deg, #e5be48 0%, #bb8f3c 100%);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(170, 127, 49, 0.5);
        }

        /* Botón estilo Cristal (Crear cuenta) */
        .btn.secondary { 
            background: rgba(255, 255, 255, 0.05); 
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.25);
            box-shadow: none;
            font-weight: 600;
        }

        .btn.secondary:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.4);
        }

        /* --- ENLACES Y TEXTOS --- */
        .muted { 
            color: var(--muted); 
            font-size: 0.85rem; 
            text-decoration: none;
        }

        a.muted:hover {
            color: #ffffff;
            text-decoration: underline;
        }

        .small { 
            font-size: 0.85rem; 
            color: rgba(255, 255, 255, 0.85); 
        }

        .row-between { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            gap: 8px; 
            margin-top: 4px;
            margin-bottom: 18px;
        }

        .error { 
            color: #ff6b6b; 
            font-size: 0.88rem; 
            margin-top: 8px; 
            min-height: 1.2em; 
            text-align: center;
        }

        /* --- MODALES --- */
        .modal { 
            display: none; 
            position: fixed; 
            inset: 0; 
            background: rgba(0, 0, 0, 0.65); 
            backdrop-filter: blur(8px); 
            -webkit-backdrop-filter: blur(8px);
            align-items: center; 
            justify-content: center; 
            z-index: 100; 
        }

        .modal-content { 
            background: rgba(18, 48, 32, 0.95); 
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-top: 4px solid var(--gold);
            padding: 2rem; 
            border-radius: 16px; 
            width: 90%; 
            max-width: 380px; 
            color: #ffffff;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.7);
        }

        .modal-content h2 {
            margin-top: 0;
            margin-bottom: 8px;
            font-size: 1.3rem;
        }

        .spinner { 
            display: inline-block; 
            width: 18px; 
            height: 18px; 
            border-radius: 50%; 
            border: 2px solid rgba(0,0,0,0.2); 
            border-top-color: #000; 
            animation: spin 0.8s linear infinite; 
            vertical-align: middle; 
        }

        @keyframes spin { 
            to { transform: rotate(360deg); } 
        }

        .toast { 
            position: fixed; 
            bottom: 30px; 
            right: 30px; 
            background: rgba(15, 58, 46, 0.95); 
            border: 1px solid var(--gold);
            color: white; 
            padding: 1rem 1.8rem; 
            border-radius: 12px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.5); 
            animation: fadeIn 0.4s ease; 
            z-index: 200; 
        }

        @keyframes fadeIn { 
            from { opacity: 0; transform: translateY(20px); } 
            to { opacity: 1; transform: translateY(0); } 
        }
    </style>
</head>
<body>

    <!-- CANVAS DEL EFECTO SILK -->
    <canvas id="silk-canvas"></canvas>

    <!-- TARJETA DE LOGIN -->
    <main class="login-card" aria-labelledby="loginTitle">
        <div class="brand">
            <img src="/frontend/logo_uco.png" alt="Logo UCO">
            <div style="flex:1">
                <h1 id="loginTitle">Acceso al Sistema</h1>
                <div class="muted" style="text-align: center;">Ingresa con tu usuario o correo institucional</div>
            </div>
        </div>
        
        <form id="login-form" novalidate>
            <div class="form-row">
                <label for="login-username">Usuario o correo</label>
                <input id="login-username" name="username" type="text" autocomplete="username" placeholder="usuario o correo@dominio" required>
            </div>
            <div class="form-row">
                <label for="login-password">Contraseña</label>
                <div class="pw-row">
                    <input id="login-password" name="password" type="password" autocomplete="current-password" placeholder="Contraseña" required>
                    <button type="button" id="toggle-pw" class="pw-toggle" aria-label="Mostrar contraseña">👁</button>
                </div>
            </div>
            <div class="form-row row-between">
                <label class="small"><input id="rememberMe" type="checkbox"> Recordarme</label>
                <a class="muted" href="#" onclick="openModal(); return false;">¿Olvidaste tu contraseña?</a>
            </div>
            <div class="form-row">
                <button id="loginBtn" class="btn" type="submit">Entrar</button>
            </div>
            <div id="login-error" class="error" role="alert" aria-live="assertive"></div>
        </form>
        
        <div style="margin-top:10px;">
            <button id="openRegisterBtn" class="btn secondary">Crear cuenta</button>
        </div>
    </main>

    <!-- MODAL RECUPERAR -->
    <div id="forgotModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="forgotTitle">
        <div class="modal-content">
            <h2 id="forgotTitle">Recuperar Acceso</h2>
            <p class="small muted" style="margin-bottom: 12px;">Ingresa tu correo institucional y te enviaremos instrucciones.</p>
            <input id="forgot-email" type="email" placeholder="ejemplo@dominio.com">
            <div style="display:flex; gap:10px; margin-top:16px;">
                <button class="btn" onclick="sendRecovery()">Enviar</button>
                <button class="btn secondary" onclick="closeModal()">Cancelar</button>
            </div>
        </div>
    </div>

    <!-- MODAL REGISTRO -->
    <div id="registerModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="registerTitle">
        <div class="modal-content">
            <h2 id="registerTitle">Crear cuenta</h2>
            <form id="register-form">
                <div class="form-row"><label for="register-name">Nombre completo</label><input id="register-name" type="text" required></div>
                <div class="form-row"><label for="register-username">Usuario</label><input id="register-username" type="text" required></div>
                <div class="form-row"><label for="register-email">Correo electrónico</label><input id="register-email" type="email" required></div>
                <div class="form-row"><label for="register-password">Contraseña</label><input id="register-password" type="password" required></div>
                <div class="form-row"><label for="register-confirm-password">Confirmar contraseña</label><input id="register-confirm-password" type="password" required></div>
                <div class="form-row"><button id="registerBtn" type="submit" class="btn">Registrar</button></div>
            </form>
            <div style="margin-top:10px;"><button class="btn secondary" onclick="closeRegisterModal()">Cerrar</button></div>
        </div>
    </div>

    <!-- SCRIPT DE SEDA (SILK) -->
    <script>
        (function initSilk() {
            const canvas = document.getElementById('silk-canvas');
            const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

            const scene = new THREE.Scene();
            const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 2;

            const material = new THREE.ShaderMaterial({
                uniforms: {
                    uTime: { value: 0 },
                    uScale: { value: 2.4 },
                    uColor: { value: new THREE.Color('#1a4325') },
                    uNoise: { value: 3.6 },
                    uRotation: { value: 1.7 }
                },
                vertexShader: `
                    varying vec2 vUv;
                    void main() {
                        vUv = uv;
                        gl_Position = vec4(position, 1.0);
                    }
                `,
                fragmentShader: `
                    uniform float uTime;
                    uniform float uScale;
                    uniform vec3 uColor;
                    uniform float uNoise;
                    uniform float uRotation;
                    varying vec2 vUv;

                    vec3 mod289(vec3 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
                    vec2 mod289(vec2 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
                    vec3 permute(vec3 x) { return mod289(((x*34.0)+1.0)*x); }

                    float snoise(vec2 v) {
                        const vec4 C = vec4(0.211324865405187, 0.366025403784439, -0.577350269189626, 0.024390243902439);
                        vec2 i  = floor(v + dot(v, C.yy) );
                        vec2 x0 = v -   i + dot(i, C.xx);
                        vec2 i1;
                        i1 = (x0.x > x0.y) ? vec2(1.0, 0.0) : vec2(0.0, 1.0);
                        vec4 x12 = x0.xyxy + C.xxzz;
                        x12.xy -= i1;
                        i = mod289(i);
                        vec3 p = permute( permute( i.y + vec3(0.0, i1.y, 1.0 )) + i.x + vec3(0.0, i1.x, 1.0 ));
                        vec3 m = max(0.5 - vec3(dot(x0,x0), dot(x12.xy,x12.xy), dot(x12.zw,x12.zw)), 0.0);
                        m = m*m ;
                        m = m*m ;
                        vec3 x = 2.0 * fract(p * C.www) - 1.0;
                        vec3 h = abs(x) - 0.5;
                        vec3 ox = floor(x + 0.5);
                        vec3 a0 = x - ox;
                        m *= 1.79284291400159 - 0.85373472095314 * ( a0*a0 + h*h );
                        vec3 g;
                        g.x  = a0.x  * x0.x  + h.x  * x0.y;
                        g.yz = a0.yz * x12.xz + h.yz * x12.yw;
                        return 130.0 * dot(m, g);
                    }

                    void main() {
                        vec2 uv = vUv * uScale;
                        float cosR = cos(uRotation);
                        float sinR = sin(uRotation);
                        uv = vec2(uv.x * cosR - uv.y * sinR, uv.x * sinR + uv.y * cosR);

                        float n = snoise(uv + vec2(uTime * 0.1, uTime * 0.05)) * uNoise;
                        float wave = sin(uv.x * 3.0 + n + uTime) * 0.5 + 0.5;

                        vec3 finalColor = mix(uColor * 0.15, uColor * 1.5, wave);
                        gl_FragColor = vec4(finalColor, 1.0);
                    }
                `
            });

            const geometry = new THREE.PlaneGeometry(2, 2);
            const mesh = new THREE.Mesh(geometry, material);
            scene.add(mesh);

            function animate(time) {
                material.uniforms.uTime.value = time * 0.0003;
                renderer.render(scene, camera);
                requestAnimationFrame(animate);
            }
            requestAnimationFrame(animate);

            window.addEventListener('resize', () => {
                renderer.setSize(window.innerWidth, window.innerHeight);
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
            });
        })();
    </script>

    <!-- SCRIPT BACKEND -->
    <script>
        const API_URL = `${window.location.protocol}//${window.location.hostname}:8000`;
        const AUTH_TOKEN_KEY = 'auth_token';
        const AUTH_USER_KEY = 'auth_user';
        if (sessionStorage.getItem(AUTH_TOKEN_KEY) || localStorage.getItem(AUTH_TOKEN_KEY)) {
            window.location.href = 'index.html';
        }
        const forgotModal = document.getElementById('forgotModal');
        const registerModal = document.getElementById('registerModal');
        function openModal(){ forgotModal.style.display='flex'; }
        function closeModal(){ forgotModal.style.display='none'; }
        function openRegisterModal(){ registerModal.style.display='flex'; }
        function closeRegisterModal(){ registerModal.style.display='none'; }
        
        function mostrarAlerta(msg) {
            const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
            document.body.appendChild(t); setTimeout(() => t.remove(), 3000);
        }

        document.getElementById('toggle-pw').addEventListener('click', ()=>{
            const t = document.getElementById('login-password').type === 'password' ? 'text' : 'password';
            document.getElementById('login-password').type = t;
        });

        function guardarSesion(token, usuario, recordar) {
            sessionStorage.removeItem(AUTH_TOKEN_KEY);
            sessionStorage.removeItem(AUTH_USER_KEY);
            localStorage.removeItem(AUTH_TOKEN_KEY);
            localStorage.removeItem(AUTH_USER_KEY);

            if (recordar) {
                localStorage.setItem(AUTH_TOKEN_KEY, token);
                localStorage.setItem(AUTH_USER_KEY, JSON.stringify(usuario || {}));
            } else {
                sessionStorage.setItem(AUTH_TOKEN_KEY, token);
                sessionStorage.setItem(AUTH_USER_KEY, JSON.stringify(usuario || {}));
            }
        }

        document.getElementById('login-form').addEventListener('submit', async (ev)=>{
            ev.preventDefault();
            const errorEl = document.getElementById('login-error');
            const loginBtn = document.getElementById('loginBtn');
            const username = document.getElementById('login-username').value.trim();
            const password = document.getElementById('login-password').value;
            const remember = document.getElementById('rememberMe').checked;

            if (!username || !password) {
                errorEl.textContent = 'Captura usuario/correo y contraseña.';
                return;
            }

            errorEl.textContent = '';
            loginBtn.disabled = true;
            loginBtn.innerHTML = '<span class="spinner"></span>';

            try {
                const resp = await fetch(`${API_URL}/api/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username_or_email: username,
                        password,
                    }),
                });

                const data = await resp.json().catch(() => ({}));
                if (!resp.ok) {
                    throw new Error(data?.detail || 'No se pudo iniciar sesión.');
                }

                if (!data?.access_token) {
                    throw new Error('Respuesta inválida del servidor: token no recibido.');
                }

                guardarSesion(data.access_token, data.usuario || {}, remember);
                window.location.href = 'index.html';
            } catch (error) {
                errorEl.textContent = error.message || 'Error al iniciar sesión.';
            } finally {
                loginBtn.disabled = false;
                loginBtn.textContent = 'Entrar';
            }
        });

        document.getElementById('openRegisterBtn').addEventListener('click', openRegisterModal);
        
        document.getElementById('register-form').addEventListener('submit', async (ev)=>{
            ev.preventDefault();
            const nombre = document.getElementById('register-name').value.trim();
            const nombreUsuario = document.getElementById('register-username').value.trim();
            const email = document.getElementById('register-email').value.trim();
            const password = document.getElementById('register-password').value;
            const confirmPassword = document.getElementById('register-confirm-password').value;

            if (!nombre || !nombreUsuario || !email || !password || !confirmPassword) {
                mostrarAlerta('Completa todos los campos para registrarte.');
                return;
            }

            try {
                const resp = await fetch(`${API_URL}/api/auth/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        nombre,
                        nombre_usuario: nombreUsuario,
                        email,
                        password,
                        confirm_password: confirmPassword,
                        rol: 'empleado',
                    }),
                });

                const data = await resp.json().catch(() => ({}));
                if (!resp.ok) {
                    throw new Error(data?.detail || 'No se pudo registrar la cuenta.');
                }

                mostrarAlerta(data?.mensaje || 'Cuenta registrada correctamente. Ahora puedes iniciar sesión.');
                closeRegisterModal();
            } catch (error) {
                mostrarAlerta(error.message || 'Error al registrar cuenta.');
            }
        });

        function sendRecovery(){ alert('Se ha enviado un correo (simulado).'); closeModal(); }
    </script>
</body>
</html>
