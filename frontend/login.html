<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' data: blob: https://cdnjs.cloudflare.com; connect-src 'self' http://127.0.0.1:5500 http://localhost:8000 http://127.0.0.1:8000 http://172.16.6.50:8000; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' https://fonts.googleapis.com https://fonts.gstatic.com;">
    <title>Acceso - UCO</title>
    <style>
        /* --- VARIABLES --- */
        :root { 
            --forest-dark: #081d17;
            --purple: #340C51; 
            --purple-hover: #481370;
            --gold: #AA7F31; 
            --gold-hover: #c4953c;
            --muted: rgba(255, 255, 255, 0.65); 
        }
        
        * { 
            box-sizing: border-box; 
            margin: 0;
            padding: 0;
        }
        
        body { 
            margin: 0; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; 
            background-color: var(--forest-dark);
            overflow: hidden;
            position: relative;
        }

        /* --- CANVAS SILK --- */
        #silk-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
        }

        /* --- TARJETA PRINCIPAL --- */
        .login-card { 
            position: relative;
            z-index: 10;
            background: rgba(12, 35, 23, 0.68); 
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 2.2rem 2rem; 
            border-radius: 18px; 
            width: 90%; 
            max-width: 420px; 
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-top: 5px solid var(--gold); 
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6); 
            text-align: left; 
        }

        /* --- MARCA Y TITULOS --- */
        .brand { 
            display: flex; 
            flex-direction: column; 
            gap: 8px; 
            align-items: center; 
            margin-bottom: 1.5rem; 
        }
        
        .brand img { 
            width: 110px; 
            height: 110px; 
            object-fit: contain; 
            filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.4));
        }
        
        h1 { 
            margin: 0 0 6px 0; 
            font-size: 1.45rem; 
            text-align: center; 
            color: #ffffff;
            font-weight: 700;
        }

        /* --- CAMPOS DE ENTRADA --- */
        .form-row { 
            margin-bottom: 16px; 
        }

        label { 
            display: block; 
            font-size: 0.85rem; 
            color: rgba(255, 255, 255, 0.9); 
            margin-bottom: 6px; 
            font-weight: 500;
        }

        input[type="text"], 
        input[type="email"], 
        input[type="password"] { 
            width: 100%; 
            padding: 12px 14px; 
            border-radius: 10px; 
            border: 1px solid rgba(255, 255, 255, 0.18); 
            background: rgba(0, 0, 0, 0.25); 
            color: #ffffff; 
            font-size: 0.95rem; 
            outline: none;
            transition: all 0.25s ease;
        }

        input[type="text"]:focus, 
        input[type="email"]:focus, 
        input[type="password"]:focus {
            border-color: var(--gold);
            background: rgba(0, 0, 0, 0.45);
            box-shadow: 0 0 0 3px rgba(170, 127, 49, 0.25);
        }

        input::placeholder {
            color: rgba(255, 255, 255, 0.38);
        }

        .pw-row { 
            position: relative;
            display: flex; 
            align-items: center; 
        }

        .pw-toggle { 
            position: absolute;
            right: 12px;
            background: transparent; 
            border: none; 
            cursor: pointer; 
            color: var(--muted); 
            font-size: 1.1rem;
        }

        /* --- BOTONES REDISEÑADOS --- */
        .btn { 
            width: 100%; 
            background: linear-gradient(135deg, #d4af37 0%, #aa7f31 100%); 
            color: #0b2219; 
            padding: 13px 16px; 
            border: none; 
            border-radius: 10px; 
            font-weight: 700; 
            font-size: 0.95rem;
            cursor: pointer; 
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(170, 127, 49, 0.35);
        }

        .btn:hover {
            background: linear-gradient(135deg, #e5be48 0%, #bb8f3c 100%);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(170, 127, 49, 0.5);
        }

        /* Botón estilo Cristal (Crear cuenta) */
        .btn.secondary { 
            background: rgba(255, 255, 255, 0.05); 
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.25);
            box-shadow: none;
            font-weight: 600;
        }

        .btn.secondary:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.4);
        }

        /* --- ENLACES Y TEXTOS --- */
        .muted { 
            color: var(--muted); 
            font-size: 0.85rem; 
            text-decoration: none;
        }

        a.muted:hover {
            color: #ffffff;
            text-decoration: underline;
        }

        .small { 
            font-size: 0.85rem; 
            color: rgba(255, 255, 255, 0.85); 
        }

        .row-between { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            gap: 8px; 
            margin-top: 4px;
            margin-bottom: 18px;
        }

        .error { 
            color: #ff6b6b; 
            font-size: 0.88rem; 
            margin-top: 8px; 
            min-height: 1.2em; 
            text-align: center;
        }

        /* --- MODALES --- */
        .modal { 
            display: none; 
            position: fixed; 
            inset: 0; 
            background: rgba(0, 0, 0, 0.65); 
            backdrop-filter: blur(8px); 
            -webkit-backdrop-filter: blur(8px);
            align-items: center; 
            justify-content: center; 
            z-index: 100; 
        }

        .modal-content { 
            background: rgba(18, 48, 32, 0.95); 
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-top: 4px solid var(--gold);
            padding: 2rem; 
            border-radius: 16px; 
            width: 90%; 
            max-width: 380px; 
            color: #ffffff;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.7);
        }

        .modal-content h2 {
            margin-top: 0;
            margin-bottom: 8px;
            font-size: 1.3rem;
        }

        .spinner { 
            display: inline-block; 
            width: 18px; 
            height: 18px; 
            border-radius: 50%; 
            border: 2px solid rgba(0,0,0,0.2); 
            border-top-color: #000; 
            animation: spin 0.8s linear infinite; 
            vertical-align: middle; 
        }

        @keyframes spin { 
            to { transform: rotate(360deg); } 
        }

        .toast { 
            position: fixed; 
            bottom: 30px; 
            right: 30px; 
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(15, 58, 46, 0.95); 
            border: 1px solid rgba(170, 127, 49, 0.7);
            color: white; 
            padding: 0.95rem 1.2rem; 
            border-radius: 12px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.5); 
            animation: fadeIn 0.4s ease; 
            z-index: 200; 
            max-width: 420px;
            min-width: 260px;
        }

        .toast-icon {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.9rem;
            flex-shrink: 0;
        }

        .toast.toast-success .toast-icon {
            background: rgba(34, 197, 94, 0.22);
            color: #86efac;
        }

        .toast.toast-error {
            border-color: rgba(248, 113, 113, 0.65);
            background: rgba(68, 20, 20, 0.94);
        }

        .toast.toast-error .toast-icon {
            background: rgba(248, 113, 113, 0.22);
            color: #fecaca;
        }

        .toast.toast-info .toast-icon {
            background: rgba(96, 165, 250, 0.25);
            color: #bfdbfe;
        }

        .modal-msg {
            margin-top: 10px;
            min-height: 1.1rem;
            font-size: 0.83rem;
        }

        .modal-msg.error {
            color: #fca5a5;
        }

        .modal-msg.success {
            color: #86efac;
        }

        @keyframes fadeIn { 
            from { opacity: 0; transform: translateY(20px); } 
            to { opacity: 1; transform: translateY(0); } 
        }
    </style>
</head>
<body>

    <!-- CANVAS DEL EFECTO SILK -->
    <canvas id="silk-canvas"></canvas>

    <!-- TARJETA DE LOGIN -->
    <main class="login-card" aria-labelledby="loginTitle">
        <div class="brand">
            <img src="/frontend/logo_uco.png" alt="Logo UCO">
            <div style="flex:1">
                <h1 id="loginTitle">Acceso al Sistema</h1>
                <div class="muted" style="text-align: center;">Ingresa con tu usuario o correo institucional</div>
            </div>
        </div>
        
        <form id="login-form" novalidate>
            <div class="form-row">
                <label for="login-username">Usuario o correo</label>
                <input id="login-username" name="username" type="text" autocomplete="username" placeholder="usuario o correo@dominio" required>
            </div>
            <div class="form-row">
                <label for="login-password">Contraseña</label>
                <div class="pw-row">
                    <input id="login-password" name="password" type="password" autocomplete="current-password" placeholder="Contraseña" required>
                    <button type="button" id="toggle-pw" class="pw-toggle" aria-label="Mostrar contraseña">👁</button>
                </div>
            </div>
            <div class="form-row row-between">
                <label class="small"><input id="rememberMe" type="checkbox"> Recordarme</label>
                <a class="muted" href="#" onclick="openModal(); return false;">¿Olvidaste tu contraseña?</a>
            </div>
            <div class="form-row">
                <button id="loginBtn" class="btn" type="submit">Entrar</button>
            </div>
            <div id="login-error" class="error" role="alert" aria-live="assertive"></div>
        </form>
        
        <div style="margin-top:10px;">
            <button id="openRegisterBtn" class="btn secondary">Crear cuenta</button>
        </div>
    </main>

    <!-- MODAL RECUPERAR -->
    <div id="forgotModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="forgotTitle">
        <div class="modal-content">
            <h2 id="forgotTitle">Recuperar Acceso</h2>
            <p class="small muted" style="margin-bottom: 12px;">Ingresa tu correo institucional y te enviaremos instrucciones.</p>
            <input id="forgot-email" type="email" placeholder="ejemplo@dominio.com">
            <div id="forgot-msg" class="modal-msg"></div>
            <div style="display:flex; gap:10px; margin-top:16px;">
                <button id="btn-send-recovery" class="btn" onclick="sendRecovery()">Enviar</button>
                <button class="btn secondary" onclick="closeModal()">Cancelar</button>
            </div>
        </div>
    </div>

    <!-- MODAL RESET PASSWORD -->
    <div id="resetModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="resetTitle">
        <div class="modal-content">
            <h2 id="resetTitle">Restablecer contraseña</h2>
            <p class="small muted" style="margin-bottom: 12px;">Ingresa el token de recuperación y define tu nueva contraseña.</p>
            <div class="form-row"><label for="reset-token">Token</label><input id="reset-token" type="text" placeholder="Pega aquí tu token"></div>
            <div class="form-row"><label for="reset-password">Nueva contraseña</label><input id="reset-password" type="password" placeholder="Mínimo 8 caracteres"></div>
            <div class="form-row"><label for="reset-confirm-password">Confirmar contraseña</label><input id="reset-confirm-password" type="password" placeholder="Repite la contraseña"></div>
            <div id="reset-msg" class="modal-msg"></div>
            <div style="display:flex; gap:10px; margin-top:16px;">
                <button id="btn-reset-password" class="btn" onclick="submitResetPassword()">Guardar contraseña</button>
                <button class="btn secondary" onclick="closeResetModal()">Cancelar</button>
            </div>
        </div>
    </div>

    <!-- MODAL REGISTRO -->
    <div id="registerModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="registerTitle">
        <div class="modal-content">
            <h2 id="registerTitle">Crear cuenta</h2>
            <form id="register-form">
                <div class="form-row"><label for="register-name">Nombre completo</label><input id="register-name" type="text" required></div>
                <div class="form-row"><label for="register-username">Usuario</label><input id="register-username" type="text" required></div>
                <div class="form-row"><label for="register-employee-id">Número de empleado</label><input id="register-employee-id" type="number" min="1" step="1" placeholder="Ej. 138" required></div>
                <div class="form-row"><label for="register-email">Correo electrónico</label><input id="register-email" type="email" required></div>
                <div class="form-row"><label for="register-password">Contraseña</label><input id="register-password" type="password" required></div>
                <div class="form-row"><label for="register-confirm-password">Confirmar contraseña</label><input id="register-confirm-password" type="password" required></div>
                <div class="form-row"><button id="registerBtn" type="submit" class="btn">Registrar</button></div>
            </form>
            <div style="margin-top:10px;"><button class="btn secondary" onclick="closeRegisterModal()">Cerrar</button></div>
        </div>
    </div>

    <!-- SCRIPT BACKEND -->
    <script>
        const API_BASES = [
            `${window.location.protocol}//${window.location.hostname}:8000`,
            `${window.location.protocol}//${window.location.hostname}:8001`,
        ];
        let API_URL = API_BASES[0];

        async function apiFetch(path, options = {}) {
            let saw404 = false;
            let lastNetworkError = null;

            for (const base of API_BASES) {
                try {
                    const resp = await fetch(`${base}${path}`, options);
                    if (resp.status === 404) {
                        saw404 = true;
                        continue;
                    }
                    API_URL = base;
                    return resp;
                } catch (error) {
                    lastNetworkError = error;
                }
            }

            if (saw404) {
                throw new Error('El servicio no está disponible en el backend activo.');
            }
            throw lastNetworkError || new Error('No se pudo conectar con el servidor.');
        }
        const AUTH_TOKEN_KEY = 'auth_token';
        const AUTH_USER_KEY = 'auth_user';
        if (sessionStorage.getItem(AUTH_TOKEN_KEY) || localStorage.getItem(AUTH_TOKEN_KEY)) {
            window.location.href = 'index.html';
        }
        const forgotModal = document.getElementById('forgotModal');
        const registerModal = document.getElementById('registerModal');
        const resetModal = document.getElementById('resetModal');
        function openModal(){ forgotModal.style.display='flex'; }
        function closeModal(){ 
            forgotModal.style.display='none';
            const msg = document.getElementById('forgot-msg');
            if (msg) { msg.className = 'modal-msg'; msg.textContent = ''; }
        }
        function openRegisterModal(){ registerModal.style.display='flex'; }
        function closeRegisterModal(){ registerModal.style.display='none'; }
        function openResetModal(token = ''){ 
            if (token) document.getElementById('reset-token').value = token;
            resetModal.style.display='flex'; 
        }
        function closeResetModal(){ 
            resetModal.style.display='none';
            const msg = document.getElementById('reset-msg');
            if (msg) { msg.className = 'modal-msg'; msg.textContent = ''; }
        }
        
        function mostrarAlerta(msg, tipo = 'info') {
            const iconos = { success: '✓', error: '✕', info: 'i' };
            const t = document.createElement('div');
            t.className = `toast toast-${tipo}`;
            t.innerHTML = `<span class="toast-icon">${iconos[tipo] || 'i'}</span><span>${msg}</span>`;
            document.body.appendChild(t); setTimeout(() => t.remove(), 3000);
        }

        function etiquetaCampo(campoRaw) {
            const campo = String(campoRaw || '').toLowerCase();
            const mapa = {
                username_or_email: 'Usuario o correo',
                nombre_usuario: 'Usuario',
                nombre: 'Nombre completo',
                email: 'Correo electrónico',
                password: 'Contraseña',
                confirm_password: 'Confirmar contraseña',
                new_password: 'Nueva contraseña',
            };
            return mapa[campo] || campoRaw || 'Campo';
        }

        function traducirMensajeValidacion(msgRaw, campoRaw = '') {
            const msg = String(msgRaw || 'Valor inválido').toLowerCase();
            const campo = etiquetaCampo(campoRaw);

            if (msg.includes('field required') || msg.includes('missing')) {
                return `${campo} es obligatorio.`;
            }
            if (msg.includes('at least') && msg.includes('characters')) {
                return `${campo} no cumple con la longitud mínima requerida.`;
            }
            if (msg.includes('at most') && msg.includes('characters')) {
                return `${campo} excede la longitud permitida.`;
            }
            if (msg.includes('string should match pattern')) {
                if (String(campoRaw).toLowerCase() === 'nombre_usuario') {
                    return 'Usuario: solo letras, números y guion bajo (_).';
                }
                return `${campo} tiene un formato inválido.`;
            }
            if (msg.includes('value error')) {
                return `${campo} contiene un valor inválido.`;
            }

            const msgDirecto = String(msgRaw || '').trim();
            if (msgDirecto) return msgDirecto;
            return `${campo} es inválido.`;
        }

        function obtenerMensajeErrorAPI(payload, fallback = 'Ocurrió un error.') {
            if (!payload) return fallback;

            const detail = payload.detail ?? payload.message ?? payload.error;
            if (!detail) return fallback;

            if (typeof detail === 'string') return detail;

            if (Array.isArray(detail)) {
                const partes = detail.map((item) => {
                    if (typeof item === 'string') return item;
                    if (item && typeof item === 'object') {
                        const campo = Array.isArray(item.loc) && item.loc.length ? item.loc[item.loc.length - 1] : '';
                        if (typeof item.msg === 'string') return traducirMensajeValidacion(item.msg, campo);
                        if (typeof item.message === 'string') return item.message;
                    }
                    return '';
                }).filter(Boolean);

                if (partes.length) return partes.join(' | ');
                return fallback;
            }

            if (typeof detail === 'object') {
                if (typeof detail.msg === 'string') return detail.msg;
                if (typeof detail.message === 'string') return detail.message;
                return fallback;
            }

            return fallback;
        }

        document.getElementById('toggle-pw').addEventListener('click', ()=>{
            const t = document.getElementById('login-password').type === 'password' ? 'text' : 'password';
            document.getElementById('login-password').type = t;
        });

        function guardarSesion(token, usuario, recordar) {
            sessionStorage.removeItem(AUTH_TOKEN_KEY);
            sessionStorage.removeItem(AUTH_USER_KEY);
            localStorage.removeItem(AUTH_TOKEN_KEY);
            localStorage.removeItem(AUTH_USER_KEY);

            if (recordar) {
                localStorage.setItem(AUTH_TOKEN_KEY, token);
                localStorage.setItem(AUTH_USER_KEY, JSON.stringify(usuario || {}));
            } else {
                sessionStorage.setItem(AUTH_TOKEN_KEY, token);
                sessionStorage.setItem(AUTH_USER_KEY, JSON.stringify(usuario || {}));
            }
        }

        document.getElementById('login-form').addEventListener('submit', async (ev)=>{
            ev.preventDefault();
            const errorEl = document.getElementById('login-error');
            const loginBtn = document.getElementById('loginBtn');
            const username = document.getElementById('login-username').value.trim();
            const password = document.getElementById('login-password').value.trim();
            const remember = document.getElementById('rememberMe').checked;

            if (!username || !password) {
                errorEl.textContent = 'Captura usuario/correo y contraseña.';
                return;
            }

            errorEl.textContent = '';
            loginBtn.disabled = true;
            loginBtn.innerHTML = '<span class="spinner"></span>';

            try {
                const resp = await apiFetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username_or_email: username,
                        password,
                    }),
                });

                const data = await resp.json().catch(() => ({}));
                if (!resp.ok) {
                    throw new Error(obtenerMensajeErrorAPI(data, 'No se pudo iniciar sesión.'));
                }

                if (!data?.access_token) {
                    throw new Error('Respuesta inválida del servidor: token no recibido.');
                }

                guardarSesion(data.access_token, data.usuario || {}, remember);

                try {
                    const redirectResp = await fetch(`${API_URL}/api/dashboard-empleados`, {
                        method: 'GET',
                        headers: {
                            'Authorization': `Bearer ${data.access_token}`,
                            'Accept': 'application/json',
                        },
                    });

                    if (redirectResp.ok) {
                        const lista = await redirectResp.json();
                        if (Array.isArray(lista) && lista.length === 0) {
                            window.location.href = '/frontend/screenUsuarios/inicio.html';
                        } else {
                            window.location.href = 'index.html';
                        }
                    } else {
                        window.location.href = 'index.html';
                    }
                } catch (_err) {
                    window.location.href = 'index.html';
                }
            } catch (error) {
                errorEl.textContent = error.message || 'Error al iniciar sesión.';
            } finally {
                loginBtn.disabled = false;
                loginBtn.textContent = 'Entrar';
            }
        });

        document.getElementById('openRegisterBtn').addEventListener('click', openRegisterModal);
        
        document.getElementById('register-form').addEventListener('submit', async (ev)=>{
            ev.preventDefault();
            const nombre = document.getElementById('register-name').value.trim();
            const nombreUsuario = document.getElementById('register-username').value.trim();
            const employeeIdRaw = document.getElementById('register-employee-id').value;
            const employeeId = Number(employeeIdRaw);
            const email = document.getElementById('register-email').value.trim();
            const password = document.getElementById('register-password').value;
            const confirmPassword = document.getElementById('register-confirm-password').value;

            if (!nombre || !nombreUsuario || !email || !password || !confirmPassword || !employeeIdRaw) {
                mostrarAlerta('Completa todos los campos para registrarte.', 'error');
                return;
            }

            if (!Number.isInteger(employeeId) || employeeId <= 0) {
                mostrarAlerta('El número de empleado debe ser un entero mayor a 0.', 'error');
                return;
            }

            try {
                const resp = await apiFetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        nombre,
                        nombre_usuario: nombreUsuario,
                        email,
                        password,
                        confirm_password: confirmPassword,
                        rol: 'empleado',
                        id_empleado: employeeId,
                    }),
                });

                const data = await resp.json().catch(() => ({}));
                if (!resp.ok) {
                    throw new Error(obtenerMensajeErrorAPI(data, 'No se pudo registrar la cuenta.'));
                }

                mostrarAlerta(data?.mensaje || 'Cuenta registrada correctamente. Ahora puedes iniciar sesión.', 'success');
                closeRegisterModal();
            } catch (error) {
                mostrarAlerta(error.message || 'Error al registrar cuenta.', 'error');
            }
        });

        async function sendRecovery(){
            const emailInput = document.getElementById('forgot-email');
            const msgEl = document.getElementById('forgot-msg');
            const btn = document.getElementById('btn-send-recovery');
            const email = (emailInput?.value || '').trim();

            if (!email) {
                if (msgEl) {
                    msgEl.className = 'modal-msg error';
                    msgEl.textContent = 'Ingresa tu correo institucional.';
                }
                return;
            }

            if (msgEl) {
                msgEl.className = 'modal-msg';
                msgEl.textContent = '';
            }
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span>';

            try {
                const resp = await apiFetch('/api/auth/password-recovery/request', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email }),
                });

                const data = await resp.json().catch(() => ({}));
                if (!resp.ok) {
                    throw new Error(obtenerMensajeErrorAPI(data, 'No se pudo solicitar recuperación.'));
                }

                if (msgEl) {
                    msgEl.className = 'modal-msg success';
                    msgEl.textContent = data?.message || 'Solicitud procesada correctamente.';
                }
                mostrarAlerta(data?.message || 'Revisa tu correo para continuar.', 'success');

                if (data?.recovery_token) {
                    mostrarAlerta('Modo local: se habilitó el restablecimiento con token.', 'info');
                    closeModal();
                    openResetModal(data.recovery_token);
                }
            } catch (error) {
                if (msgEl) {
                    msgEl.className = 'modal-msg error';
                    msgEl.textContent = error.message || 'Error al solicitar recuperación.';
                }
                mostrarAlerta(error.message || 'Error al solicitar recuperación.', 'error');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Enviar';
            }
        }

        async function submitResetPassword() {
            const token = (document.getElementById('reset-token')?.value || '').trim();
            const newPassword = document.getElementById('reset-password')?.value || '';
            const confirmPassword = document.getElementById('reset-confirm-password')?.value || '';
            const msgEl = document.getElementById('reset-msg');
            const btn = document.getElementById('btn-reset-password');

            if (!token || !newPassword || !confirmPassword) {
                if (msgEl) {
                    msgEl.className = 'modal-msg error';
                    msgEl.textContent = 'Completa token y contraseñas.';
                }
                return;
            }

            if (newPassword !== confirmPassword) {
                if (msgEl) {
                    msgEl.className = 'modal-msg error';
                    msgEl.textContent = 'Las contraseñas no coinciden.';
                }
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span>';

            try {
                const resp = await apiFetch('/api/auth/password-recovery/reset', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        token,
                        new_password: newPassword,
                        confirm_password: confirmPassword,
                    }),
                });

                const data = await resp.json().catch(() => ({}));
                if (!resp.ok) {
                    throw new Error(obtenerMensajeErrorAPI(data, 'No se pudo actualizar la contraseña.'));
                }

                if (msgEl) {
                    msgEl.className = 'modal-msg success';
                    msgEl.textContent = data?.message || 'Contraseña actualizada correctamente.';
                }
                mostrarAlerta(data?.message || 'Contraseña actualizada.', 'success');
                setTimeout(() => closeResetModal(), 900);
            } catch (error) {
                if (msgEl) {
                    msgEl.className = 'modal-msg error';
                    msgEl.textContent = error.message || 'Error al restablecer contraseña.';
                }
                mostrarAlerta(error.message || 'Error al restablecer contraseña.', 'error');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Guardar contraseña';
            }
        }

        // Exponer funciones para onclick embebido
        window.openModal = openModal;
        window.closeModal = closeModal;
        window.openRegisterModal = openRegisterModal;
        window.closeRegisterModal = closeRegisterModal;
        window.openResetModal = openResetModal;
        window.closeResetModal = closeResetModal;
        window.sendRecovery = sendRecovery;
        window.submitResetPassword = submitResetPassword;

        // Si viene token en la URL, abrir modal de reset automáticamente
        const urlToken = new URLSearchParams(window.location.search).get('reset_token');
        if (urlToken) {
            openResetModal(urlToken);
        }
    </script>
</body>
</html>
